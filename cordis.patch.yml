# dsh-chatmode bundle layer.
#
# Inserts one agent-preset declaration: the "聊天模式 / Chat mode" mode. A
# session selects it in the mode picker. The mode mounts only the shared
# `web_search` / `web_fetch` tools, so the agent loop can take several steps
# while the model is limited to web research. The `dsh-chatmode` row keeps the
# Skill catalog as a prompt message, injects a skill body when the user invokes
# it with `/skill-name`, reads `@`-referenced files into the same step, owns the
# persona prompt, and carries the per-session "smart search" switch that can
# take both web tools away again. No other tool is exposed.
#
# There is no `dsh-persona` row on purpose: that row contributes a static
# string, while this mode's prompt has to describe whether the web tools are
# available right now. A complete persona is the sole prompt section, so the
# dynamic text cannot be added beside it — the `dsh-chatmode` row registers it.
#
# The Host publishes one `name`/`description` string per custom preset, so the
# declaration carries a bilingual fallback; the package's Client half localizes
# the mode-picker entry for the active UI language and renders the switch in the
# composer.
- insert:
    - id: preset-chatmode
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chatmode
        name: '聊天模式 / Chat mode'
        description: '保留 Skill，可联网搜索与抓取（可用「智能搜索」开关关闭），自动读取 @ 引用的文件与图片。 / Keeps Skills, adds web search and fetch behind a Smart search switch, and reads @-referenced files and images.'
        order: 5
        plugins:
          # The only model-facing tools in this mode. The runtime half keeps
          # every globally mounted tool out of this preset's scope while leaving
          # these two registrations visible, and hides them per step when the
          # session's switch is off.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # Keeps Skills working without a skill tool, injects `@` file context,
          # owns the complete persona prompt, folds `/smartsearch`, and
          # guarantees that no other globally mounted tool leaks into this mode.
          - id: chatmode
            name: 'dsh-chatmode'
